id: A17
name: Log Deletion - history -c or rm /var/log
severity: high
risk_score: 8
mitre_tactics:
- Defense Evasion
mitre_techniques:
- T1070.002
nist_800_53:
- SI-4
sox_itgc:
- ITGC-SEC-01
conditions:
  any:
  - field: cmdline
    operator: regex
    value: history\s+-[cw]
