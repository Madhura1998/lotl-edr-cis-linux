file_permissions:
  /etc/passwd: "644"
  /etc/shadow: "600"
  /etc/group: "644"
  /etc/gshadow: "600"

sshd_config:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  X11Forwarding: "no"

sysctl:
  net.ipv4.ip_forward: "0"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"

suid_binaries:
  - "/usr/bin/newgrp"
  - "/usr/bin/gpasswd"
  - "/usr/bin/su"
  - "/usr/bin/chfn"
  - "/usr/bin/mount"
  - "/usr/bin/fusermount3"
  - "/usr/bin/pkexec"
  - "/usr/bin/umount"
  - "/usr/bin/sudo"
  - "/usr/bin/chsh"
  - "/usr/bin/passwd"
  - "/usr/sbin/pppd"
